version: "3.8"

services:
  evolution_postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: "no"
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=evolution_user
      - POSTGRES_PASSWORD=evolution_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution_redis:
    container_name: evolution_redis
    image: redis:latest
    restart: "no"
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  evolution_api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: "no"
    depends_on:
      - evolution_redis
      - evolution_postgres
    ports:
      - "8080:8080"
    environment:
      - BODY_LIMIT=500MB
      - LIMIT_PAYLOAD=500mb
      - LIMIT_FILE_SIZE=500mb
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
    env_file:
      - .env

  evolution_frontend:
    container_name: evolution_frontend
    image: evoapicloud/evolution-manager:latest
    restart: "no"
    ports:
      - "3000:80"
    networks:
      - evolution-net

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
